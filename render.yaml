# Render Blueprint: one web service running the FastAPI app (dashboard at /, monitoring at /admin).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Secrets are entered in the dashboard,
# never committed. With the LLM_* values left empty the app runs in "rules mode".
services:
  - type: web
    name: multi-agent-care-coordinator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MAX_RETRIES
        value: "2"
      - key: TARGET_GRADE
        value: "8"
      # AMD-hosted model (OpenAI-compatible /v1 URL). Must be reachable from the internet.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: SAFETY_BASE_URL
        sync: false
      - key: SAFETY_API_KEY
        sync: false
      - key: SAFETY_MODEL
        sync: false
